name: 打包发布

# 打 tag 触发（git push origin HEAD --follow-tags），也可以手动跑一次只出产物
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: '手动打包的原因（可选，仅做记录）'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 校验 → 测试 → 打包 → 发布
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验版本号（manifest 与 tag 必须一致）
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/check-version.mjs "$GITHUB_REF_NAME"
          else
            node scripts/check-version.mjs
          fi

      - name: 静态检查 + 测试 + 打包
        run: node scripts/release.mjs --pack-only

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pwdmg-${{ github.ref_name }}
          path: |
            dist/pwdmg-chrome.zip
            dist/pwdmg-firefox.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: 创建 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: pwdmg ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装

            **Chrome / Edge**
            1. 下载 `pwdmg-chrome.zip` 并解压
            2. 打开 `chrome://extensions`（Edge 为 `edge://extensions`），打开右上角「开发者模式」
            3. 点「加载已解压的扩展程序」，选择解压出来的目录

            **Firefox（115+）**
            1. 打开 `about:debugging#/runtime/this-firefox`
            2. 点「临时载入附加组件」，选择 `pwdmg-firefox.zip` 解压后的 `manifest.json`

            > 也可以用仓库里的 `dist/chrome`、`dist/firefox` 目录直接加载，或按 README 自行 `npm run build`。

            ## 校验

            下载后用 `sha256sum -c SHA256SUMS.txt`（Windows：`certutil -hashfile 文件名 SHA256`）核对。
          files: |
            dist/pwdmg-chrome.zip
            dist/pwdmg-firefox.zip
            dist/SHA256SUMS.txt

      - name: 汇总
        run: |
          echo "### pwdmg ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
